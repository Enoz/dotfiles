# -*- conf -*-

# Disable all built-in keyboard shortcuts except F11 for fullscreen.
[key-bindings]
scrollback-up-page=none
scrollback-up-half-page=none
scrollback-up-line=none
scrollback-down-page=none
scrollback-down-half-page=none
scrollback-down-line=none
scrollback-home=none
scrollback-end=none
clipboard-copy=none
clipboard-paste=none
primary-paste=none
search-start=none
font-increase=none
font-decrease=none
font-reset=none
spawn-terminal=none
minimize=none
maximize=none
fullscreen=F11
# pipe-* actions are unbound by default. Unlike regular actions, they require
# a [command] before their key bindings, so bare "none" values are invalid.
show-urls-launch=none
show-urls-copy=none
show-urls-persistent=none
prompt-prev=none
prompt-next=none
unicode-input=none
color-theme-switch-dark=none
color-theme-switch-light=none
color-theme-toggle=none
noop=none
quit=none
