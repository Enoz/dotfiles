# -*- conf -*-

[main]
font=monospace:size=12
initial-window-size-chars=120x28

# Match WezTerm's high-contrast black and white colors.
[colors-dark]
background=000000
foreground=ffffff
cursor=000000 ffffff
selection-foreground=000000
selection-background=ffffff

# Disable all built-in keyboard shortcuts except fullscreen and font sizing.
[key-bindings]
scrollback-up-page=none
scrollback-up-half-page=none
scrollback-up-line=none
scrollback-down-page=none
scrollback-down-half-page=none
scrollback-down-line=none
scrollback-home=none
scrollback-end=none
clipboard-copy=none
clipboard-paste=none
primary-paste=none
search-start=none
# Producing "+" consumes Shift, so Control+plus is Ctrl+Shift+plus.
font-increase=Control+plus
font-decrease=Control+Shift+minus
font-reset=none
spawn-terminal=none
minimize=none
maximize=none
fullscreen=F11
# pipe-* actions are unbound by default. Unlike regular actions, they require
# a [command] before their key bindings, so bare "none" values are invalid.
show-urls-launch=none
show-urls-copy=none
show-urls-persistent=none
prompt-prev=none
prompt-next=none
unicode-input=none
color-theme-switch-dark=none
color-theme-switch-light=none
color-theme-toggle=none
noop=none
quit=none
